<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO VPN + Proxy Utility</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 500px; width: 100%; padding: 40px; background: #141420; border-radius: 16px; border: 1px solid #2a2a3a; }
        h1 { font-size: 32px; margin-bottom: 8px; color: #00d4ff; }
        p { color: #888; margin-bottom: 24px; }
        .btn { display: block; width: 100%; padding: 14px; background: #00d4ff; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .btn.secondary { background: #2a2a3a; color: #fff; }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="container">
        <h1>NEO VPN</h1>
        <p>Сеть нового поколения. VPN + Proxy Utility в одном сервисе.</p>
        <button class="btn" onclick="alert('Регистрация скоро!')">🚀 Начать бесплатный триал</button>
        <button class="btn secondary" onclick="alert('Тарифы скоро!')">💎 Тарифы</button>
        <button class="btn secondary" onclick="alert('Прокси скоро!')">🛠 Создать прокси</button>
    </div>
</body>
</html>
